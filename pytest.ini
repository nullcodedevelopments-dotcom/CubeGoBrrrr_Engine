[pytest]
# Pytest configuration for Personal_UTIL workspace

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for categorizing tests
markers =
    integration: Integration tests involving multiple components
    unit: Unit tests for individual modules
    slow: Tests that take a long time to run
    database: Database-related tests
    profile: ProfileManager-related tests
    util: Util layer tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Minimum Python version
minversion = 3.10

# Coverage options (with --cov flag)
[coverage:run]
source = src
omit = 
    */tests/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING: